name: Secret 泄露扫描

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 2 * * 1" # 每周一，独立于耗时的镜像安全扫描
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks（完整 Git 历史）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 会执行 git log --full-history；浅克隆只会扫描当前提交。
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_ENABLE_COMMENTS: "false"
