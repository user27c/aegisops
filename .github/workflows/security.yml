name: 安全扫描

on:
  schedule:
    - cron: "0 3 * * 1" # 每周一
  pull_request:
    paths:
      - ".github/workflows/security.yml"
      - "config/**"
      - "deploy/**"
      - "docker/**"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - "services/diagnosis/**"
      - "web/**"

jobs:
  security:
    name: 依赖与配置安全
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: azure/setup-helm@v4
      - name: gitleaks（Secret 泄露）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: pip-audit
        working-directory: services/diagnosis
        run: |
          pip install pip-audit
          uv export --frozen --format requirements-txt | pip-audit -r /dev/stdin
      - name: pnpm audit
        working-directory: web
        run: pnpm audit --audit-level=high
      - name: Trivy 镜像扫描
        run: |
          docker build -t aegisops-operator:security -f docker/operator.Dockerfile .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --severity CRITICAL,HIGH --no-progress aegisops-operator:security
      - name: Kubernetes 配置检查
        run: |
          helm template deploy/helm/aegisops > rendered.yaml
          docker run --rm -v "$PWD:/project" ghcr.io/yannh/kubeconform/cmd/kubeconform:latest \
            -summary -strict -ignore-missing-schemas /project/rendered.yaml
