name: 安全扫描

on:
  schedule:
    - cron: "0 3 * * 1" # 每周一
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "services/diagnosis/**"
      - "web/package.json"
      - "web/pnpm-lock.yaml"

jobs:
  security:
    name: 依赖与配置安全
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
      - name: gitleaks（Secret 泄露）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: pip-audit
        working-directory: services/diagnosis
        run: |
          pip install pip-audit
          uv export --frozen --format requirements-txt | pip-audit -r /dev/stdin
      - name: pnpm audit
        working-directory: web
        run: pnpm audit --audit-level=high
      - name: Trivy 镜像扫描
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --severity CRITICAL,HIGH --no-progress aegisops-operator:ci || true
      - name: Kubernetes 配置检查
        run: |
          docker run --rm -v "$PWD:/project" ghcr.io/yannh/kubeconform/cmd/kubeconform:latest \
            -summary -strict -ignore-missing-schemas \
            $(helm template deploy/helm/aegisops > /tmp/rendered.yaml && echo /tmp/rendered.yaml) || true
