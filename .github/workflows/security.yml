name: 安全扫描

on:
  schedule:
    - cron: "0 3 * * 1" # 每周一
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/security.yml"
      - "config/**"
      - "deploy/**"
      - "docker/**"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - "services/diagnosis/**"
      - "web/**"

permissions:
  contents: read

jobs:
  security:
    name: 依赖与配置安全
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: azure/setup-helm@v4
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: pip-audit
        working-directory: services/diagnosis
        run: |
          pip install pip-audit
          # --no-emit-project：审计依赖而非项目自身；否则 editable self-ref 与
          # --require-hashes 冲突，pip-audit 的 dry-run install 会失败。
          uv export --frozen --format requirements-txt --no-emit-project | pip-audit -r /dev/stdin
      - name: pnpm audit
        working-directory: web
        run: pnpm audit --audit-level=high
      - name: 构建 Incident API Web 静态资源（供镜像构建）
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Trivy 镜像扫描（阻断门禁，5 个镜像）
        # 与 scripts/release-check.sh 对齐：--exit-code 1 让 HIGH/CRITICAL 变成阻断门禁，
        # 并扫描全部 5 个镜像（而非仅 operator）。版本固定，避免 CI 随 latest 漂移。
        run: |
          scripts/build-images.sh --registry aegisops-security --tag security
          for image in aegisops-operator aegisops-alert-gateway aegisops-incident-api aegisops-diagnosis fault-lab; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/project" -w /project \
              aquasec/trivy:0.73.0 image --exit-code 1 --severity CRITICAL,HIGH \
              --ignorefile /project/.trivyignore --no-progress "aegisops-security/${image}:security"
          done
      - name: Kubernetes 配置检查
        run: |
          helm template deploy/helm/aegisops > rendered.yaml
          docker run --rm -v "$PWD:/project" ghcr.io/yannh/kubeconform:v0.8.0 \
            -summary -strict -ignore-missing-schemas /project/rendered.yaml
