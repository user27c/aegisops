name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: 构建并发布镜像与 Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送镜像（amd64/arm64）
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          docker buildx create --name release-builder --use || true
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "ghcr.io/${{ github.repository_owner }}/aegisops-operator:${TAG}" \
            -t "ghcr.io/${{ github.repository_owner }}/aegisops-operator:sha-${GITHUB_SHA::7}" \
            -f docker/operator.Dockerfile .
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "ghcr.io/${{ github.repository_owner }}/aegisops-alert-gateway:${TAG}" \
            -f docker/alert-gateway.Dockerfile .
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "ghcr.io/${{ github.repository_owner }}/aegisops-incident-api:${TAG}" \
            -f docker/incident-api.Dockerfile .
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "ghcr.io/${{ github.repository_owner }}/aegisops-diagnosis:${TAG}" \
            -f services/diagnosis/Dockerfile services/diagnosis
      - name: 打包 Helm Chart
        run: |
          helm package deploy/helm/aegisops --version "${GITHUB_REF_NAME#v}"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "aegisops-*.tgz"
          generate_release_notes: true
