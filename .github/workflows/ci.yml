name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.3"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  repository-hygiene:
    name: 仓库卫生与 E2E artifact 边界
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 仓库卫生
        run: bash scripts/check-repo-hygiene.sh
      - name: E2E artifact sanitizer 回归
        run: python3 tests/scripts/test_e2e_artifact_sanitizer.py
      - name: M9.7 受控采集脚本解析回归
        run: python3 tests/scripts/test_eval_capture_scripts.py
      - name: 云端脚本离线安全回归
        run: python3 tests/scripts/test_cloud_scripts.py
      - name: 发布门禁脚本离线安全回归
        run: python3 tests/scripts/test_release_check.py

  generated:
    name: 生成文件一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: 生成并校验无漂移
        run: |
          make generate manifests
          git diff --exit-code -- api/ config/ || { echo "生成文件有漂移"; exit 1; }

  terraform:
    name: 阿里云演示基础设施
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: Terraform fmt 与 validate（不访问云资源）
        run: bash infra/terraform/aliyun/tests/terraform_validate.sh

  go:
    name: Go 检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt/vet
        run: |
          test -z "$(gofmt -l api cmd internal)" || { echo "存在未格式化文件"; exit 1; }
          go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
      - name: 单元测试（race + coverage）
        run: go test $(go list ./... | grep -Ev '/tests?/') -race -coverprofile cover.out
      - name: 上传覆盖率
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: cover.out

  envtest:
    name: envtest 集成测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: envtest
        run: make test-envtest

  python:
    name: Python 诊断服务
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/diagnosis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装依赖（含测试工具）
        run: uv sync --frozen --extra dev
      - name: ruff + mypy
        run: |
          uv run ruff check app tests
          uv run mypy app
      - name: pytest + coverage
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: M9.7 评估器静态检查与单元测试
        working-directory: .
        run: |
          uv run --project services/diagnosis ruff check eval/aegis_eval eval/tests
          uv run --project services/diagnosis python -m unittest discover -s eval/tests -v
      - name: M9.7 已签署受控数据集完整性
        working-directory: .
        run: |
          cd eval/datasets/v1-verified-r4
          sha256sum --check SHA256SUMS
          cd ../../..
          uv run --project services/diagnosis python scripts/audit_m97_verified_dataset.py --dataset eval/datasets/v1-verified-r4

  diagnosis-integration:
    name: Diagnosis PostgreSQL 集成测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装诊断服务依赖（含集成测试工具）
        working-directory: services/diagnosis
        run: uv sync --frozen --extra dev
      - name: 真实 PostgreSQL API 集成测试
        run: make test-integration

  web:
    name: Web 控制台
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: lint + typecheck
        run: pnpm lint && pnpm typecheck
      - name: vitest
        run: pnpm test
      - name: 构建
        run: pnpm build

  manifests:
    name: Helm 与清单校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/aegisops
      - name: values schema 校验
        run: |
          helm template deploy/helm/aegisops --values deploy/helm/aegisops/values.yaml > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
      - name: promtool 校验告警规则
        run: |
          set -Eeuo pipefail
          rules_dir="$(mktemp -d)"
          prom_dir="$(mktemp -d)"
          trap 'rm -rf "$rules_dir" "$prom_dir"' EXIT
          scripts/render-prometheus-rules.sh --output "$rules_dir/rule.yaml" --skip-promtool
          cp deploy/observability/tests/aegisops.rules.test.yml "$rules_dir/tests.yml"
          archive="$prom_dir/prometheus.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/prometheus/prometheus/releases/download/v3.13.2/prometheus-3.13.2.linux-amd64.tar.gz \
            --output "$archive"
          echo "0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f  $archive" | sha256sum --check --status
          tar -xzf "$archive" --strip-components=1 -C "$prom_dir"
          "$prom_dir/promtool" check rules "$rules_dir/rule.yaml"
          "$prom_dir/promtool" test rules "$rules_dir/tests.yml"

  docker-build:
    name: 镜像构建（不推送）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: docker/setup-buildx-action@v3
      - name: 构建 Incident API Web 静态资源
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: 构建五个镜像
        run: |
          docker buildx build -t aegisops-operator:ci -f docker/operator.Dockerfile .
          docker buildx build -t aegisops-alert-gateway:ci -f docker/alert-gateway.Dockerfile .
          docker buildx build -t aegisops-incident-api:ci -f docker/incident-api.Dockerfile .
          docker buildx build -t aegisops-diagnosis:ci -f services/diagnosis/Dockerfile .
          docker buildx build -t fault-lab:ci -f fault-lab/Dockerfile fault-lab
