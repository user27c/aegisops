# gitleaks 配置：继承内置默认规则，仅放行仓库内已知的伪凭据。
# 重要：自定义配置不会自动加载默认规则，必须显式 [extend] useDefault = true。
[extend]
  useDefault = true

[allowlist]
  description = "测试夹具与文档示例中的伪凭据（非真实密钥）"
  # 仅放行确定性的测试夹具文件（_test.go 内的假 secret，非真实凭据）。
  paths = [
    '''internal/evidence/loki_test\.go''',
    '''internal/evidence/redactor_test\.go''',
  ]
  # 文档里出现的具体伪 curl 凭据示例，按字符串收窄，避免整文件放行。
  regexes = [
    '''console-token-xyz''',
    '''webhook-token-123''',
  ]
