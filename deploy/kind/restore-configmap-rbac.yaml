apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegisops-operator-restore-configmap
  namespace: fault-lab
  labels:
    app.kubernetes.io/part-of: aegisops
    app.kubernetes.io/component: fault-lab
rules:
  # Helm's normal operator Role remains read-only for ConfigMaps. This
  # fixture grants the one narrowly-scoped write needed by the local restore
  # E2E, and only for the allow-listed target ConfigMap.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["checkout-config"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegisops-operator-restore-configmap
  namespace: fault-lab
  labels:
    app.kubernetes.io/part-of: aegisops
    app.kubernetes.io/component: fault-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aegisops-operator-restore-configmap
subjects:
  - kind: ServiceAccount
    name: aegisops-operator
    namespace: fault-lab
