# AegisOps 邮件告警配置示例。
# 复制为 values-email.local.yaml(已被 .gitignore 忽略)后填写真实值。
# SMTP 授权码绝不写入此文件,由 smtp.auth.passwordSecret 引用 Kubernetes Secret。
alerting:
  enabled: true

  smtp:
    smarthost: "smtp.qq.com:587"
    from: "your-sender@qq.com"
    auth:
      enabled: true
      username: "your-sender@qq.com"
      passwordSecret:
        name: "aegisops-smtp"
        key: "password"
    requireTLS: true

  email:
    to:
      - "your-receiver@example.com"
    sendResolved: true
    subjectPrefix: "[AegisOps]"

  route:
    groupBy: ["cluster", "namespace", "alertname", "severity"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    criticalRepeatInterval: 30m

  rules:
    warningFor: 5m
    criticalFor: 2m
    reconcileErrorRate: 0.10
    diagnosisFailureRate: 0.10
    diagnosisQueueBacklog: 10
    approvalWaitSeconds: 600
    incidentStuckSeconds: 900
