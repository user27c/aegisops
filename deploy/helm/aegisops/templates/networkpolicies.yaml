{{- if .Values.networkPolicy.enabled }}
# 命名空间默认隔离：deny ingress/egress。逐组件放行最小路径。
# 注意：NetworkPolicy 无法表达域名级隔离（如 DeepSeek 只允许 api.deepseek.com），
# 只能限制端口/IP，文档中已说明该限制。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Gateway：仅接收 Alertmanager（observability 命名空间）的 Webhook。
{{- if .Values.gateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 8080}
{{- end }}
---
# Diagnosis API：仅允许 Operator 与 Incident API 访问。
{{- if .Values.diagnosis.api.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-diagnosis-api
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: diagnosis-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: operator
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: incident-api
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - {protocol: TCP, port: 5432}
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
{{- end }}
---
{{- if .Values.diagnosis.worker.enabled }}
# Diagnosis Worker：只允许访问 PostgreSQL 与 DNS（无入站流量）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-diagnosis-worker
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: diagnosis-worker
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
{{- end }}
---
# Migrations Job：仅允许访问 PostgreSQL 与 DNS（helm hook 执行 alembic）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-migrations
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migrations
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
---
# PostgreSQL：放行 operator/incident-api/diagnosis 组件的入站访问。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: operator
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: incident-api
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: diagnosis-api
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: diagnosis-worker
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: migrations
      ports:
        - {protocol: TCP, port: 5432}
---
# Incident API：仅允许 Operator/Gateway 访问;出站允许诊断服务与 PostgreSQL。
{{- if .Values.incidentApi.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-incident-api
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: incident-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: operator
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: gateway
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: diagnosis-api
      ports:
        - {protocol: TCP, port: 8000}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
{{- end }}
{{- if .Values.observability.serviceMonitor }}
---
# Prometheus（observability 命名空间）抓取 AegisOps 指标。
# operator/gateway/incident-api 暴露 8080，diagnosis-api 暴露 8000。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-metrics-scrape
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/instance, operator: In, values: ["{{ .Release.Name }}"]}
      - {key: app.kubernetes.io/component, operator: In, values: [operator, gateway, incident-api, diagnosis-api]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8000}
{{- end }}
---
# Kubernetes API server 出站：operator/gateway/incident-api 需要访问控制面
# （operator 的 leader election 与 CRD 读写、gateway 创建 Incident、incident-api 读取/审批）。
# 标准集群 apiserver 是 kube-system 中的静态 Pod（6443），集群内经 kubernetes Service（443）访问；
# k3s 中 apiserver 是节点进程，集群内经 kubernetes Service（默认 service CIDR 10.43.0.0/16，
# 即 10.43.0.1:443）访问。外部出口仍被 default-deny 阻断。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-internal-egress
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/instance, operator: In, values: ["{{ .Release.Name }}"]}
      - {key: app.kubernetes.io/component, operator: In, values: [operator, gateway, incident-api]}
  policyTypes: [Egress]
  egress:
    # API server（标准集群：kube-system 静态 Pod）
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: TCP, port: 6443}
        - {protocol: TCP, port: 443}
    # API server（k3s：kubernetes Service，service CIDR）
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - {protocol: TCP, port: 443}
{{- if .Values.observability.otelCollector.enabled }}
---
# 所有 AegisOps Pod 仅可向同 namespace 的 Collector 导出 OTLP gRPC。
# 这条策略与各组件已有 Egress 策略相加，不放宽其它出站目的地。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-otel-export
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: otel-collector
      ports:
        - {protocol: TCP, port: 4317}
---
# Collector 只接收本 namespace 的 OTLP，并且只向 observability/Tempo 导出。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-otel-collector
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-collector
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 4317}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 4317}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
{{- end }}
{{- end }}
