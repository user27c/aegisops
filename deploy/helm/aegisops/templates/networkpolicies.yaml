{{- if .Values.networkPolicy.enabled }}
# 命名空间默认隔离：deny ingress/egress。逐组件放行最小路径。
# 注意：NetworkPolicy 无法表达域名级隔离（如 DeepSeek 只允许 api.deepseek.com），
# 只能限制端口/IP，文档中已说明该限制。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Gateway：仅接收 Alertmanager 的 Webhook。
{{- if .Values.gateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {protocol: TCP, port: 8080}
{{- end }}
---
# Diagnosis API：仅允许 Operator 与 Incident API 访问。
{{- if .Values.diagnosis.api.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-diagnosis-api
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: diagnosis-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: operator
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: incident-api
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - {protocol: TCP, port: 5432}
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
{{- end }}
{{- end }}
