{{- if .Values.diagnosis.api.enabled }}
# DB migration Job：普通 Job(非 hook),install/upgrade 时随 manifest apply 立即创建并执行
# alembic upgrade head(幂等)。普通 Job 才被 helm --wait 等待,与 diagnosis-api 的
# readyz(需 alembic_version 表)时序自洽;post-install hook 在 --wait 场景下不执行
# 会造成三方死锁。upgrade 重跑时旧 Job 保留不重跑(表已建,no-op)。
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aegisops.fullname" . }}-migrations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "aegisops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
      containers:
        - name: migrations
          image: {{ include "aegisops.image" (dict "registry" $.Values.global.imageRegistry "repository" .Values.diagnosis.api.image.repository "tag" $.Values.global.imageTag "digest" .Values.diagnosis.api.image.digest ) }}
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgres" (include "aegisops.fullname" .) }}
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
{{- end }}
