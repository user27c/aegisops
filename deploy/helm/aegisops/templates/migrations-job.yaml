{{- if .Values.diagnosis.api.enabled }}
# DB migration Job：普通 Job(非 hook),install/upgrade 时随 manifest apply 立即创建并执行
# alembic upgrade head(幂等)。普通 Job 才被 helm --wait 等待,与 diagnosis-api 的
# readyz(需 alembic_version 表)时序自洽;post-install hook 在 --wait 场景下不执行
# 会造成三方死锁。Job 的 Pod template 不可变，因此以 Release.Revision 命名，确保
# 镜像升级时创建新 Job 而不是尝试修改已完成 Job 的 template。
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aegisops.fullname" . }}-migrations-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "aegisops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
      initContainers:
        # 普通 Job 与 PostgreSQL StatefulSet 会并发创建。先等数据库接受连接，
        # 避免首次镜像拉取/初始化时 migration 在 backoffLimit 内耗尽重试。
        - name: wait-postgres
          image: {{ printf "%s:%s" .Values.postgresql.internal.image.repository .Values.postgresql.internal.image.tag | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h {{ printf "%s-postgres" (include "aegisops.fullname" .) }} -p 5432 -U aegisops -d aegisops; do
                echo "waiting for PostgreSQL"
                sleep 2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
      containers:
        - name: migrations
          image: {{ include "aegisops.image" (dict "registry" $.Values.global.imageRegistry "repository" .Values.diagnosis.api.image.repository "tag" (default $.Values.global.imageTag .Values.diagnosis.api.image.tag) "chartAppVersion" $.Chart.AppVersion "digest" .Values.diagnosis.api.image.digest ) }}
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgres" (include "aegisops.fullname" .) }}
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
{{- end }}
