{{- if .Values.diagnosis.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisops.fullname" . }}-diagnosis-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: diagnosis-api
spec:
  replicas: {{ .Values.diagnosis.api.replicas }}
  selector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: diagnosis-api
  template:
    metadata:
      labels:
        {{- include "aegisops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: diagnosis-api
    spec:
      serviceAccountName: {{ include "aegisops.serviceAccountName" (dict "component" "diagnosis" | merge .) }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: diagnosis-api
          image: {{ include "aegisops.image" (dict "repository" .Values.diagnosis.api.image.repository "digest" .Values.diagnosis.api.image.digest | merge .) }}
          args: []
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgres" (include "aegisops.fullname" .) }}
                  key: url
            - name: LLM_PROVIDER
              value: {{ .Values.diagnosis.llmProvider | quote }}
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.diagnosis.deepseekExistingSecret }}
                  key: api-key
                  optional: true
            - name: EMBEDDING_MODEL
              value: {{ .Values.diagnosis.embedding.model | quote }}
            - name: EMBEDDING_CACHE_DIR
              value: {{ .Values.diagnosis.embedding.cachePVC | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.global.otelEndpoint | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
{{- end }}
