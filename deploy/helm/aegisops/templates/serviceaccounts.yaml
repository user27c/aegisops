{{- if .Values.operator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegisops.serviceAccountName" (dict "component" "operator" | merge .) }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
---
{{- end }}
{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegisops.serviceAccountName" (dict "component" "gateway" | merge .) }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
---
{{- end }}
{{- if .Values.incidentApi.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegisops.serviceAccountName" (dict "component" "api" | merge .) }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
---
{{- end }}
{{- if .Values.diagnosis.api.enabled }}
# 诊断服务不挂载任何 Kubernetes 凭据：automountServiceAccountToken=false
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegisops.serviceAccountName" (dict "component" "diagnosis" | merge .) }}
  namespace: {{ .Release.Namespace }}
  automountServiceAccountToken: false
  labels: {{ include "aegisops.labels" . | nindent 4 }}
{{- end }}
