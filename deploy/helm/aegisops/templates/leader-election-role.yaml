# Operator leader election：仅系统命名空间的 Lease。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aegisops.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aegisops.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aegisops.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "aegisops.serviceAccountName" (dict "component" "operator" | merge .) }}
    namespace: {{ .Release.Namespace }}
