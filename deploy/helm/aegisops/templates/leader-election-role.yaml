# Operator leader election：仅系统命名空间的 Lease。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aegisops.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    # 仅 leader election 所需的最小动词（乐观锁 Get/Update/Patch）。
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aegisops.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{ include "aegisops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aegisops.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "aegisops.serviceAccountName" (dict "component" "operator" ) }}
    namespace: {{ .Release.Namespace }}
