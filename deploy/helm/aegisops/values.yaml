# AegisOps Helm 默认值。所有镜像必须固定 tag/digest，禁止 latest。

global:
  clusterID: local-k3s
  imageRegistry: ghcr.io/user27c
  imageTag: ""
  watchNamespaces: [fault-lab]
  otelEndpoint: ""

imagePullSecrets: []

operator:
  enabled: true
  image:
    repository: aegisops-operator
    tag: ""
    digest: ""
  replicas: 2
  leaderElection: true
  diagnosisTokenSecret: aegisops-diagnosis-token
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }

gateway:
  enabled: true
  image:
    repository: aegisops-alert-gateway
    tag: ""
    digest: ""
  replicas: 1
  webhookTokenSecret: aegisops-gateway-token
  maxBodyBytes: 1048576
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 256Mi }

incidentApi:
  enabled: true
  image:
    repository: aegisops-incident-api
    tag: ""
    digest: ""
  replicas: 1
  auth:
    mode: static-tokens
    existingSecret: aegisops-console-auth
  ingress:
    enabled: false
    host: ""
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 256Mi }

diagnosis:
  api:
    enabled: true
    replicas: 1
    image:
      repository: aegisops-diagnosis
      tag: ""
      digest: ""
  worker:
    enabled: true
    replicas: 1
    concurrency: 2
    image:
      repository: aegisops-diagnosis
      tag: ""
      digest: ""
  deepseekExistingSecret: deepseek-api
  llmProvider: fake
  embedding:
    # dev/CI 默认 fake（不加载 torch/不下载模型）；生产设为 BAAI/bge-small-zh-v1.5
    model: fake
    cachePVC: aegisops-embedding-cache

postgresql:
  internal:
    enabled: true
    image:
      repository: pgvector/pgvector
      tag: pg16
      digest: ""
    storageClassName: ""
    storageSize: 10Gi
  external:
    urlSecret: ""

observability:
  serviceMonitor: true
  prometheusRule: true
  grafanaDashboard: true
  # kube-prometheus-stack 的 Prometheus 默认用 release label 选择 ServiceMonitor。
  releaseName: kube-prometheus-stack

# 邮件告警(M9.2)。默认关闭;开启请复制 values-email.example.yaml 为
# values-email.local.yaml 并填写真实值(SMTP 密码只进 Secret)。
alerting:
  enabled: false
  smtp:
    smarthost: ""
    from: ""
    requireTLS: true
    auth:
      enabled: false
      username: ""
      passwordSecret: { name: "", key: "" }
  email:
    to: []
    sendResolved: true
    subjectPrefix: "[AegisOps]"
  route:
    groupBy: [cluster, namespace, alertname, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    criticalRepeatInterval: 30m
  rules:
    warningFor: 5m
    criticalFor: 2m
    reconcileErrorRate: 0.10
    diagnosisFailureRate: 0.10
    diagnosisQueueBacklog: 10
    approvalWaitSeconds: 600
    incidentStuckSeconds: 900

networkPolicy:
  enabled: true
