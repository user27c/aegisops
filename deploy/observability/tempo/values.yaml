# Tempo 本地配置(单二进制模式)。
server:
  http_listen_port: 3200
  grpc_listen_port: 9095  # otlp receiver 使用 4317,避免冲突

distributor:
  receivers:
    otlp:
      protocols:
        grpc: {}
        http: {}

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo-traces
    wal:
      path: /tmp/tempo-wal
