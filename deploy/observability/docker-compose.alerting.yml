# AegisOps 告警通知本地测试环境(Alertmanager + MailHog)。
# 默认只连 MailHog(example.invalid 保留域);真实 SMTP 需 --allow-real-email 并
# 提供 alertmanager.local.yml(见 scripts/alerting-up.sh)。
name: aegisops-alerting

services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "18025:8025"   # Mail UI
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8025/api/v2/messages"]
      interval: 3s
      timeout: 2s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    ports:
      - "14317:4317"
      - "14318:4318"
    volumes:
      - type: bind
        source: ./otel/collector.yaml
        target: /etc/otel/collector.yaml
        read_only: true
    command: ["--config", "/etc/otel/collector.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 3s
      retries: 10

  tempo:
    image: grafana/tempo:2.4.1
    ports:
      - "13200:3200"
      - "14320:4317"
    command: ["-config.file=/etc/tempo/values.yaml"]
    volumes:
      - type: bind
        source: ./tempo/values.yaml
        target: /etc/tempo/values.yaml
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.27.0
    depends_on:
      mailhog:
        condition: service_healthy
    ports:
      - "19093:9093"
    volumes:
      - type: bind
        source: ./alertmanager/alertmanager.mailhog.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
      - type: bind
        source: ./alertmanager/templates
        target: /etc/alertmanager/templates
        read_only: true
      - type: bind
        source: ./alertmanager/secrets
        target: /etc/alertmanager/secrets
        read_only: true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9093/-/healthy"]
      interval: 3s
      timeout: 2s
      retries: 10
